<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Toko Realtime</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center p-2 sm:p-4">

    <!-- Container Utama App -->
    <div class="w-full max-w-md md:max-w-4xl bg-slate-800 border border-slate-700 rounded-xl shadow-2xl overflow-hidden flex flex-col min-h-[90vh]">
        
        <!-- Header / Nama Toko Realtime -->
        <header class="bg-slate-800/90 backdrop-blur border-b border-slate-700 p-4 sticky top-0 z-20 flex justify-between items-center">
            <div>
                <h1 id="storeNameDisplay" class="text-xl font-bold text-amber-500 tracking-wide uppercase">
                    Memuat Nama Toko...
                </h1>
                <p id="storeTaglineDisplay" class="text-xs text-slate-400">Solusi & Sparepart Terpercaya</p>
            </div>
            <button onclick="toggleAdminModal()" class="bg-slate-700 hover:bg-slate-600 text-amber-400 border border-amber-500/30 text-xs px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition">
                <i class="fa-solid fa-lock"></i> Login Admin
            </button>
        </header>

        <!-- Search Bar -->
        <div class="p-4 bg-slate-800/50 border-b border-slate-700/50">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-sm"></i>
                <input type="text" id="searchInput" oninput="renderProducts()" placeholder="Cari produk..." 
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-amber-500 transition">
            </div>
        </div>

        <!-- Banner Promo -->
        <div class="p-4">
            <div class="bg-gradient-to-r from-amber-600/20 via-slate-800 to-amber-600/20 border border-amber-500/30 rounded-xl p-4 text-center">
                <span class="bg-amber-500 text-slate-950 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">⚡ Promo Spesial</span>
                <h2 id="bannerTitleDisplay" class="text-base font-bold text-slate-100 mt-2">KATALOG DIGITAL REALTIME</h2>
                <p class="text-xs text-slate-400 mt-0.5">Solusi Kebutuhan Teknologi Terpercaya</p>
            </div>
        </div>

        <!-- Section Katalog Produk -->
        <main class="flex-1 p-4">
            <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Katalog Produk</h3>
            <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                <!-- Data Produk dikirim via JS Realtime -->
            </div>
        </main>

        <!-- Footer / Cart Bar -->
        <footer class="bg-slate-800 border-t border-slate-700 p-3 flex justify-between items-center sticky bottom-0 z-20">
            <div class="flex items-center gap-2">
                <div class="relative bg-slate-900 p-2.5 rounded-lg border border-slate-700">
                    <i class="fa-solid fa-cart-shopping text-amber-500"></i>
                    <span id="cartBadge" class="absolute -top-1.5 -right-1.5 bg-amber-500 text-slate-950 text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">0</span>
                </div>
                <div>
                    <p class="text-[10px] text-slate-400 uppercase">Total Pesanan (<span id="cartCount">0</span> item)</p>
                    <p id="cartTotal" class="text-sm font-bold text-slate-100">Rp 0</p>
                </div>
            </div>
            <button onclick="sendToWhatsApp()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs px-4 py-2.5 rounded-xl flex items-center gap-2 transition">
                Checkout WA <i class="fa-solid fa-arrow-right"></i>
            </button>
        </footer>
    </div>

    <!-- Modal Admin (Pengaturan Toko & Produk) -->
    <div id="adminModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-xl w-full max-w-md p-5 space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <h3 class="font-bold text-amber-500">Panel Pengaturan Toko</h3>
                <button onclick="toggleAdminModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <!-- Form Ubah Nama Toko -->
            <div class="space-y-2">
                <label class="text-xs text-slate-300 font-semibold">Nama Toko (Realtime di Semua Perangkat):</label>
                <input type="text" id="storeNameInput" placeholder="Contoh: TECHCARE SOLUTION" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-200">
                <button onclick="saveStoreSettings()" class="w-full bg-amber-500 text-slate-950 font-bold text-xs py-2 rounded-lg hover:bg-amber-400">
                    Simpan Nama Toko
                </button>
            </div>

            <hr class="border-slate-700">

            <!-- Form Tambah Produk -->
            <div class="space-y-2">
                <h4 class="text-xs text-slate-300 font-semibold">Tambah Produk Baru:</h4>
                <input type="text" id="prodName" placeholder="Nama Produk" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-200">
                <input type="number" id="prodPrice" placeholder="Harga (Contoh: 50000)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-200">
                <button onclick="addNewProduct()" class="w-full bg-slate-700 border border-amber-500/40 text-amber-400 font-bold text-xs py-2 rounded-lg hover:bg-slate-600">
                    + Tambah Produk
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase Realtime Database SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Konfigurasi Database Realtime Gratis
        const firebaseConfig = {
            databaseURL: "https://techcare-catalog-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Referensi Node Database
        const settingsRef = ref(db, 'storeSettings');
        const productsRef = ref(db, 'products');

        let productsData = {};
        let cart = [];

        // 1. DENGARKAN PERUBAHAN NAMA TOKO SECARA REALTIME
        onValue(settingsRef, (snapshot) => {
            const data = snapshot.val();
            if (data && data.storeName) {
                document.getElementById('storeNameDisplay').innerText = data.storeName;
                document.getElementById('bannerTitleDisplay').innerText = data.storeName + " PROMO";
            } else {
                document.getElementById('storeNameDisplay').innerText = "TECHCARE SOLUTION";
            }
        });

        // 2. DENGARKAN PERUBAHAN PRODUK SECARA REALTIME
        onValue(productsRef, (snapshot) => {
            productsData = snapshot.val() || {};
            window.renderProducts();
        });

        // FUNGSI SIMPAN NAMA TOKO KE FIREBASE
        window.saveStoreSettings = function() {
            const newName = document.getElementById('storeNameInput').value.trim();
            if(!newName) return alert("Masukkan nama toko terlebih dahulu!");
            
            set(settingsRef, {
                storeName: newName
            }).then(() => {
                alert("Nama toko berhasil diperbarui ke semua perangkat secara realtime!");
                document.getElementById('storeNameInput').value = "";
                window.toggleAdminModal();
            });
        };

        // FUNGSI TAMBAH PRODUK KE FIREBASE
        window.addNewProduct = function() {
            const name = document.getElementById('prodName').value.trim();
            const price = parseInt(document.getElementById('prodPrice').value);

            if(!name || !price) return alert("Lengkapi nama dan harga produk!");

            push(productsRef, {
                name: name,
                price: price
            }).then(() => {
                document.getElementById('prodName').value = "";
                document.getElementById('prodPrice').value = "";
                alert("Produk berhasil ditambahkan!");
            });
        };

        // FUNGSI HAPUS PRODUK FROM FIREBASE
        window.deleteProduct = function(id) {
            if(confirm("Hapus produk ini?")) {
                remove(ref(db, 'products/' + id));
            }
        };

        // RENDER PRODUK KE HALAMAN WEB
        window.renderProducts = function() {
            const grid = document.getElementById('productGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = "";

            const keys = Object.keys(productsData);
            let count = 0;

            keys.forEach(key => {
                const item = productsData[key];
                if(item.name.toLowerCase().includes(search)) {
                    count++;
                    grid.innerHTML += `
                        <div class="bg-slate-900 border border-slate-700/80 rounded-xl p-3 flex flex-col justify-between hover:border-amber-500/50 transition">
                            <div>
                                <h4 class="font-semibold text-slate-100 text-sm">${item.name}</h4>
                                <p class="text-amber-500 font-bold text-xs mt-1">Rp ${item.price.toLocaleString('id-ID')}</p>
                            </div>
                            <div class="flex items-center gap-2 mt-3">
                                <button onclick="addToCart('${item.name}', ${item.price})" class="flex-1 bg-amber-500/10 hover:bg-amber-500 hover:text-slate-950 text-amber-500 border border-amber-500/30 text-xs py-1.5 rounded-lg font-bold transition">
                                    + Keranjang
                                </button>
                                <button onclick="deleteProduct('${key}')" class="text-red-400 hover:text-red-300 text-xs p-1.5">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    `;
                }
            });

            if(count === 0) {
                grid.innerHTML = `<p class="text-xs text-slate-500 text-center col-span-full py-8">Belum ada produk. Tambahkan lewat menu Login Admin.</p>`;
            }
        };

        // MODAL TOGGLE
        window.toggleAdminModal = function() {
            document.getElementById('adminModal').classList.toggle('hidden');
        };

        // SISTEM KERANJANG BELANJA LOKAL
        window.addToCart = function(name, price) {
            cart.push({ name, price });
            updateCartUI();
        };

        function updateCartUI() {
            document.getElementById('cartCount').innerText = cart.length;
            document.getElementById('cartBadge').innerText = cart.length;
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('cartTotal').innerText = "Rp " + total.toLocaleString('id-ID');
        }

        window.sendToWhatsApp = function() {
            if(cart.length === 0) return alert("Keranjang belanjaan masih kosong!");
            let msg = "Halo, saya mau pesan:\n";
            cart.forEach((i, idx) => { msg += `${idx+1}. ${i.name} - Rp ${i.price.toLocaleString('id-ID')}\n`; });
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            msg += `\n*Total: Rp ${total.toLocaleString('id-ID')}*`;
            window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
        };
    </script>
</body>
</html>
