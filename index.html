<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECHCARE - Katalog Produk Realtime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <!-- Header / Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 px-4 py-3 shadow-lg">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-amber-500 text-slate-900 p-2 rounded-lg font-bold">
                    <i class="fa-solid font-bold fa-store"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-amber-500 leading-tight">TECHCARE</h1>
                    <p class="text-xs text-slate-400">Solusi & Sparepart Terpercaya</p>
                </div>
            </div>
            <button onclick="toggleAdminModal()" class="bg-slate-700 hover:bg-slate-600 text-amber-400 text-xs px-3 py-2 rounded-lg border border-slate-600 flex items-center gap-1.5 transition">
                <i class="fa-solid fa-lock"></i>
                <span>Panel Admin</span>
            </button>
        </div>
    </header>

    <!-- Banner Promo -->
    <main class="max-w-4xl mx-auto p-4 space-y-6">
        <div class="bg-gradient-to-r from-amber-600 to-amber-800 rounded-2xl p-6 shadow-xl text-center border border-amber-500/30">
            <span class="bg-amber-400/20 text-amber-200 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Promo Spesial</span>
            <h2 class="text-2xl font-extrabold text-white mt-2">TECHCARE PROMO & DISKON</h2>
            <p class="text-amber-100 text-sm mt-1">Solusi Kebutuhan Teknologi Terpercaya</p>
        </div>

        <!-- Section Katalog -->
        <div>
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-slate-200 text-lg flex items-center gap-2">
                    <i class="fa-solid fa-boxes-stacked text-amber-500"></i> KATALOG PRODUK
                </h3>
                <span id="statusBadge" class="text-xs bg-emerald-500/10 text-emerald-400 px-2.5 py-1 rounded-full border border-emerald-500/20 flex items-center gap-1">
                    <span class="w-2 h-2 bg-emerald-400 rounded-full animate-ping"></span> Realtime Active
                </span>
            </div>

            <!-- Loading Spinner -->
            <div id="loading" class="text-center py-12">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl text-amber-500"></i>
                <p class="text-xs text-slate-400 mt-2">Memuat data produk...</p>
            </div>

            <!-- Grid Produk -->
            <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 gap-4 hidden"></div>
            
            <!-- Jika Kosong -->
            <div id="emptyState" class="hidden text-center py-12 bg-slate-800/50 rounded-2xl border border-slate-800">
                <i class="fa-solid fa-box-open text-4xl text-slate-600 mb-2"></i>
                <p class="text-slate-400 text-sm">Belum ada produk yang ditambahkan.</p>
            </div>
        </div>
    </main>

    <!-- Modal Admin (Tambah Produk) -->
    <div id="adminModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <h3 class="font-bold text-amber-400 flex items-center gap-2">
                    <i class="fa-solid fa-plus-circle"></i> Tambah Produk Baru
                </h3>
                <button onclick="toggleAdminModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <form id="addProductForm" onsubmit="saveProduct(event)" class="space-y-3">
                <div>
                    <label class="text-xs text-slate-300 block mb-1">Nama Produk</label>
                    <input type="text" id="pName" required placeholder="Contoh: RAM DDR3 4GB" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="text-xs text-slate-300 block mb-1">Harga (Rp)</label>
                    <input type="number" id="pPrice" required placeholder="150000" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="text-xs text-slate-300 block mb-1">URL Gambar (Opsional)</label>
                    <input type="url" id="pImg" placeholder="https://..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="text-xs text-slate-300 block mb-1">Deskripsi Ringkas</label>
                    <textarea id="pDesc" rows="2" placeholder="Stok ready, garansi 1 bulan" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-amber-500"></textarea>
                </div>
                <div class="pt-2 flex gap-2">
                    <button type="button" onclick="toggleAdminModal()" class="w-1/2 bg-slate-700 hover:bg-slate-600 text-slate-300 py-2.5 rounded-lg text-sm font-semibold">Batal</button>
                    <button type="submit" id="btnSubmit" class="w-1/2 bg-amber-500 hover:bg-amber-600 text-slate-950 py-2.5 rounded-lg text-sm font-bold flex justify-center items-center gap-2">
                        <span>Simpan</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDK Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Konfigurasi Database Realtime Publik
        const firebaseConfig = {
            databaseURL: "https://techcare-catalog-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const productsRef = ref(db, 'products');

        // Mendengarkan Perubahan Data Produk Secara Realtime
        onValue(productsRef, (snapshot) => {
            const data = snapshot.val();
            const grid = document.getElementById('productGrid');
            const loading = document.getElementById('loading');
            const emptyState = document.getElementById('emptyState');
            
            grid.innerHTML = '';
            loading.classList.add('hidden');

            if (!data) {
                grid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            grid.classList.remove('hidden');

            Object.keys(data).forEach((key) => {
                const item = data[key];
                const card = document.createElement('div');
                card.className = "bg-slate-800 border border-slate-700/80 rounded-xl overflow-hidden flex flex-col justify-between shadow-md relative group hover:border-amber-500/50 transition";
                
                const imgUrl = item.image || 'https://via.placeholder.com/300x200/1e293b/94a3b8?text=Produk+Techcare';
                const formattedPrice = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(item.price);

                card.innerHTML = `
                    <div class="relative">
                        <img src="${imgUrl}" class="w-full h-32 object-cover bg-slate-900" alt="${item.name}">
                        <button onclick="deleteProduct('${key}')" class="absolute top-2 right-2 bg-red-600/80 hover:bg-red-600 text-white w-7 h-7 rounded-full flex items-center justify-center text-xs shadow transition opacity-90">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                    <div class="p-3 flex-1 flex flex-col justify-between space-y-2">
                        <div>
                            <h4 class="font-bold text-sm text-slate-100 line-clamp-1">${item.name}</h4>
                            <p class="text-xs text-slate-400 line-clamp-2 mt-0.5">${item.desc || '-'}</p>
                        </div>
                        <div>
                            <p class="font-extrabold text-amber-400 text-sm">${formattedPrice}</p>
                            <a href="https://wa.me/6281234567890?text=Halo%20Admin,%20saya%20mau%20pesan%20${encodeURIComponent(item.name)}" target="_blank" class="mt-2 w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs py-1.5 rounded-lg flex items-center justify-center gap-1 font-semibold transition">
                                <i class="fa-brands fa-whatsapp"></i> Beli
                            </a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        });

        // Simpan Produk Baru
        window.saveProduct = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

            const name = document.getElementById('pName').value;
            const price = Number(document.getElementById('pPrice').value);
            const image = document.getElementById('pImg').value;
            const desc = document.getElementById('pDesc').value;

            try {
                await push(productsRef, {
                    name,
                    price,
                    image,
                    desc,
                    createdAt: Date.now()
                });
                document.getElementById('addProductForm').reset();
                toggleAdminModal();
            } catch (err) {
                alert("Gagal menambahkan produk: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>Simpan</span>';
            }
        };

        // Hapus Produk
        window.deleteProduct = async function(key) {
            if (confirm("Yakin ingin menghapus produk ini?")) {
                await remove(ref(db, `products/${key}`));
            }
        };

        // Toggle Modal
        window.toggleAdminModal = function() {
            const modal = document.getElementById('adminModal');
            modal.classList.toggle('hidden');
        };
    </script>
</body>
</html>
